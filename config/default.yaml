# Single source of truth for every threshold/count that used to be a scattered
# module-level constant across generate.py / grade_intermediate_steps_azure.py /
# reverse_grading_resume.py / failed_instance_resume.py / the analysis notebooks.
#
# Values below match the original diffusion_module pipeline exactly, so results
# are directly comparable to Part II's reported numbers unless overridden.

generation:
  exercises: [1, 2, 3, 4]
  source_map:
    1: [2, 3, 4]
    2: [1, 3, 4]
    3: [1, 2, 4]
    4: [1, 2, 3]
  n_rounds: 3
  instances_per_round: 100
  optuna_trials: 25
  image_size: 512
  n_curve_points: 240

grading:
  score_threshold: 0.60        # pass/accept cutoff used throughout the analysis
  intermediate_step_pattern: "^(0[1-5])_.*\\.png$"
  skip_filenames: ["00_incorrect_submission.png", "06_reference_answer.png", "panel.png"]

analysis:
  # "confusing" / "robust-to-noise" classification thresholds (sec:res-confusing
  # in the Part II paper). The original codebase had a documented default of
  # 0.25 that the executed notebook silently overrode with a hardcoded 0.10 —
  # 0.10 is what actually produced the reported numbers, so it is the single,
  # named default here instead of a stray literal.
  embedding_distance_threshold: 0.10
  score_threshold: 0.60

surrogate:
  # The "good" pipeline's configuration (XAI_REVERSE in the original repo,
  # r=0.889). The other, lower-fidelity pipeline (frozen backbone + zero-
  # baseline IG, r~0.87-0.88 but visibly noisier attributions) is retired by
  # this refactor rather than kept as a second, divergent implementation.
  unfreeze_layer: "layer4"
  unfreeze_after_epoch: 60
  total_epochs: 200
  batch_size: 128
  val_fraction: 0.20
  huber_delta: 0.10

xai:
  ig_baseline: "blurred"       # "blurred" (recommended) or "zero"
  ig_smoothgrad_samples: 20
  ig_steps: 50
  ig_blur_kernel_size: 51
  ig_blur_sigma: 15.0
  saliency_smoothing_sigma: 4
  gradcam_smoothing_sigma: 6
  # Occlusion (replaces LIME): small sliding window over the 224x224 input.
  # ((224-patch)/stride + 1)^2 forward passes -- 16/8 is ~729, comparable to
  # LIME's 600 samples but deterministic and far better localized on a thin
  # curve over a mostly-white background.
  occlusion_patch_size: 16
  occlusion_stride: 8
  # Combined per-trajectory panels (5 graded steps 01-05, 4 rows: original /
  # IG+SmoothGrad / Occlusion / Guided Grad-CAM), matching
  # reverse_xai_trajectory_panels.ipynb's layout with LIME/Grad-CAM swapped
  # for methods that localize better on this task (see xai/attributions.py).
  trajectories_per_pair: 2      # top-N per (exercise, source_exercise) pair
